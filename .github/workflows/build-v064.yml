name: Build v0.6.4

on:
  push:
    branches:
      - fix/chain-alignment-0.6.2
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused regression tests
        run: |
          python -m unittest test.test_chain_alignment
          python -m unittest test.test_v063
          python -m unittest test.test_v064
      - name: Build VSIX
        run: python package_vsix.py --output clean-python-code-0.6.4.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: clean-python-code-0.6.4
          path: clean-python-code-0.6.4.vsix
